name: Publish Docker Image and Deploy

on:
    push:
        tags: ['v*.*.*']
    workflow_dispatch:
        inputs:
            custom_tag:
                description: 'Custom tag (leave empty for preview-YYYYMMDD-HHMMSS)'
                required: false
                type: string

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ibenzene/photos-bridge_server

concurrency:
    group: docker-publish-deploy
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        permissions:
            contents: read
            packages: write
            # This is used to complete the identity challenge with sigstore/fulcio.
            id-token: write
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Prepare Version
              id: version
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  CUSTOM_TAG: ${{ inputs.custom_tag }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                    VERSION="${CUSTOM_TAG:-preview-$(date +'%Y%m%d-%H%M%S')}"
                  else
                    VERSION="$REF_NAME"
                  fi
                  if [[ ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
                    echo "Invalid Docker tag: $VERSION" >&2
                    exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            # Install the cosign tool
            # https://github.com/sigstore/cosign-installer
            - name: Install Cosign
              uses: sigstore/cosign-installer@v3

            # Enable emulation for multi-platform builds
            # https://github.com/docker/setup-qemu-action
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            # Set up BuildKit Docker container builder to be able to build
            # multi-platform images and export cache
            # https://github.com/docker/setup-buildx-action
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # Login against a Docker registry
            # https://github.com/docker/login-action
            - name: Log into Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Extract metadata (tags, labels) for Docker
            # https://github.com/docker/metadata-action
            - name: Extract Docker Metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=${{ steps.version.outputs.version }}
                      type=raw,value=latest,enable=${{ github.event_name == 'push' }}

            # Build and push Docker image with Buildx
            # https://github.com/docker/build-push-action
            - name: Build and Push Docker Image
              id: build-and-push
              uses: docker/build-push-action@v6
              with:
                  context: ./apps/server
                  file: apps/server/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64,linux/arm64
                  provenance: false

            # Sign the resulting Docker image digest
            # https://github.com/sigstore/cosign
            - name: Sign the Published Docker Image
              env:
                  # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
                  DIGEST: ${{ steps.build-and-push.outputs.digest }}
              # This step uses the identity token to provision an ephemeral certificate
              # against the sigstore community Fulcio instance.
              run: cosign sign --yes "$REGISTRY/$IMAGE_NAME@$DIGEST"

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - name: Deploy to Server
              uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
              env:
                  PROJECT_PATH: ${{ vars.PROJECT_PATH }}
                  IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  IMAGE_TAG: ${{ needs.build.outputs.version }}
              with:
                  host: ${{ secrets.SSH_HOST }}
                  port: ${{ secrets.SSH_PORT }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_KEY }}
                  envs: PROJECT_PATH,IMAGE_REPO,IMAGE_TAG
                  script: |
                      set -eu
                      cd "$PROJECT_PATH"
                      test -f docker-compose.yml || { echo "PROJECT_PATH must point to the server deployment directory" >&2; exit 1; }
                      CURRENT_IMAGE="$IMAGE_REPO:$IMAGE_TAG"

                      # Pull the new image before updating the deployment configuration
                      sudo docker pull "$CURRENT_IMAGE"

                      # Update the image reference in .env for Docker Compose
                      touch .env
                      if grep -q '^PHOTOS_BRIDGE_IMAGE=' .env; then
                        sed -i "s|^PHOTOS_BRIDGE_IMAGE=[^\r]*|PHOTOS_BRIDGE_IMAGE=$CURRENT_IMAGE|" .env
                      else
                        if [ -s .env ] && [ -n "$(tail -c 1 .env)" ]; then
                          printf '\n' >> .env
                        fi
                        printf 'PHOTOS_BRIDGE_IMAGE=%s\n' "$CURRENT_IMAGE" >> .env
                      fi

                      # Recreate the service using the published image
                      sudo docker compose up -d --no-build

                      # Clean up old tags only for this repository
                      CURRENT_ID=$(sudo docker image inspect --format '{{.Id}}' "$CURRENT_IMAGE")
                      sudo docker image ls --no-trunc --format '{{.Repository}} {{.Tag}} {{.ID}}' |
                        awk -v repo="$IMAGE_REPO" -v keep="$CURRENT_ID" \
                          '$1 == repo && $2 != "<none>" && $3 != keep { print $1 ":" $2 }' |
                        while IFS= read -r image; do
                          sudo docker image rm "$image" || echo "Skipped image: $image"
                        done
